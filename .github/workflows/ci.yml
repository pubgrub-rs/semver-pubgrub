name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests and compilation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test default features
        run: cargo +stable test --locked

      - name: Test serde support
        run: cargo +stable test --locked --features serde

      - name: Check corpus example
        run: cargo +stable check --locked --manifest-path examples/crates-vers/Cargo.toml

      - name: Check fuzz targets
        run: cargo +stable check --locked --manifest-path fuzz/Cargo.toml --bins
